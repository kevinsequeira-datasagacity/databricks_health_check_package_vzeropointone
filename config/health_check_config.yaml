# =============================================================================
# Databricks Workspace Health Check (SDK edition) -- configuration
#
# Tune these values per client / environment without touching any check code.
# The orchestrator notebook loads this file and passes it into every check
# module, so a new threshold here takes effect on the next run.
# =============================================================================

# Relative importance of each category in the overall workspace score.
# Must sum to 1.0 (the orchestrator will normalise if it doesn't).
categories:
  security_iam:
    label: "Security & IAM"
    weight: 0.30
  compute:
    label: "Compute"
    weight: 0.25
  unity_catalog:
    label: "Unity Catalog"
    weight: 0.25
  jobs_cicd:
    label: "Jobs & CI/CD"
    weight: 0.20

# Score bands used to turn a 0-100 score into a letter grade in the report.
grade_bands:
  - { min: 90, label: "A - Healthy" }
  - { min: 75, label: "B - Minor issues" }
  - { min: 60, label: "C - Needs attention" }
  - { min: 40, label: "D - At risk" }
  - { min: 0,  label: "F - Critical issues" }

# Per-environment overrides: PROD and PRE-PROD are held to stricter
# expectations than DEV/TEST for a number of checks below. The orchestrator
# resolves `environment` (from the notebook widget) against this map; an
# unrecognised environment name falls back to `default`.
environment_profiles:
  default:
    is_production_like: false
  dev:
    is_production_like: false
  test:
    is_production_like: false
  preprod:
    is_production_like: true
  prod:
    is_production_like: true

thresholds:
  # ---- Security & IAM ------------------------------------------------
  tokens:
    max_lifetime_days: 90          # PATs with no expiry, or > this, are flagged
    warn_lifetime_days: 30         # PATs expiring within this window -> INFO reminder
  secret_scopes:
    disallow_databricks_backed_in_prod: true   # prefer AZURE_KEYVAULT-backed scopes in prod-like envs
  ip_access_lists:
    require_in_production_like: true
  admin_group:
    # Entra ID group(s) expected to be synced in as workspace admins.
    # Used only to sanity-check that admin rights are group-based, not to
    # hard-fail on a specific name (see SEC-002).
    expected_admin_group_names:
      - "Databricks-Workspace-Admins"

  # ---- Compute ---------------------------------------------------------
  clusters:
    max_autotermination_minutes: 120   # interactive clusters idle longer than this are flagged
    min_dbr_lts_major_minor: "13.3"    # oldest LTS runtime considered current
    require_cluster_policy_in_prod: true
    require_tags:
      - "environment"
      - "cost-center"
  sql_warehouses:
    max_auto_stop_minutes: 30
  jobs_compute:
    max_all_purpose_job_ratio: 0.20    # >20% of jobs running on all-purpose clusters is flagged

  # ---- Unity Catalog ----------------------------------------------------
  unity_catalog:
    flag_account_users_broad_grants: true   # ALL_PRIVILEGES / catalog-level grants to `account users`
    broad_privileges:
      - "ALL_PRIVILEGES"
    delta_health:
      sample_tables_per_schema: 5           # cap on DESCRIBE DETAIL calls per schema, keeps runtime bounded
      max_small_file_ratio: 0.30            # flag tables where >30% of files are "small" (<16MB heuristic)
      vacuum_stale_days: 30                 # flag tables not VACUUMed (or unknown) beyond this

  # ---- Jobs & CI/CD -------------------------------------------------------
  jobs:
    lookback_days: 30
    max_failure_rate: 0.15          # >15% failed runs in the lookback window is flagged
    require_git_source_in_prod: true
    require_service_principal_run_as_in_prod: true
  repos:
    # Databricks Repos `provider` values considered approved. JOB-006 flags
    # any checked-out repo whose provider isn't in this list. Valid
    # Databricks provider values include: azureDevOpsServices, gitHub,
    # gitHubEnterprise, gitLab, gitLabEnterpriseEdition, bitbucketCloud,
    # bitbucketServer, awsCodeCommit.
    expected_git_providers:
      - "azureDevOpsServices"
      - "gitHub"
    require_pinned_ref_in_prod: true   # PROD Repos should track a tag/commit, not a mutable branch

# API calls that can be expensive on a large workspace (Delta health scans,
# per-job run-history pulls) are capped so a health check run stays bounded
# on a big PROD workspace. Raise these once you've seen a run's duration.
limits:
  max_jobs_to_inspect: 500
  max_clusters_to_inspect: 500
  max_schemas_to_scan_for_delta_health: 50
